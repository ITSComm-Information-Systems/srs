{% include 'order/_cluster_identifier_feedback.html' %}
<span id="patch-window-preview" hx-swap-oob="innerHTML">{% if patch_window %}{{ patch_window }}{% else %}Enter a valid cluster identifier{% endif %}</span>
<select id="id_backup_time" hx-swap-oob="innerHTML">

	{% for choice in backup_time_choices %}

	{% endfor %}
</select>
